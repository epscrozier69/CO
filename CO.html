<body>

<header class="top">
  <div>
    <h1>🧭 EPS <span class="dot">•</span> Suivi course d'orientation 4<sup>ème</sup></h1>

<script>
/* ===================== STATE ===================== */
const STORAGE_KEY = "CO_app_data_v1";
const UI_KEY = "CO_app_ui_v2";
let state = loadState();
let uiState = loadUI();

function defaultState(){
  return { classes:{}, cartes:[] };
}
function loadState(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return defaultState();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ alert("Attention : sauvegarde locale impossible (stockage plein). Exportez une sauvegarde JSON."); }
}
function defaultUI(){ return { top:"general", classTab:{}, seanceTab:{} }; }
function loadUI(){
  try{ const raw = localStorage.getItem(UI_KEY); if(raw) return Object.assign(defaultUI(), JSON.parse(raw)); }catch(e){}
  return defaultUI();
}
function saveUI(){ try{ localStorage.setItem(UI_KEY, JSON.stringify(uiState)); }catch(e){} }

/* ===================== IMAGES (IndexedDB) =====================
   Les photos (cartes, barèmes) ne sont plus stockées dans le JSON localStorage
   (quota ~5-10 Mo très vite dépassé) mais dans IndexedDB (quota bien plus grand).
   imageCache garde une copie en mémoire {id: dataURL} pour un rendu synchrone. */
const IDB_NAME = "CO_images_db";
const IDB_STORE = "images";
let imageCache = {};
let dbPromise = null;

function idbOpen(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error("IndexedDB non supporté")); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return dbPromise;
}
function idbPut(id, dataURL){
  return idbOpen().then(db=> new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).put(dataURL, id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  }));
}
function idbDelete(id){
  return idbOpen().then(db=> new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  }));
}
function idbGetAll(){
  return idbOpen().then(db=> new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,"readonly");
    const store = tx.objectStore(IDB_STORE);
    const keysReq = store.getAllKeys();
    const valsReq = store.getAll();
    tx.oncomplete = ()=>{
      const map = {};
      keysReq.result.forEach((k,i)=>{ map[k]=valsReq.result[i]; });
      resolve(map);
    };
    tx.onerror = ()=>reject(tx.error);
  }));
}
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>maxDim || h>maxDim){
          if(w>=h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function migrateLegacyImages(){
  let changed = false;
  const tasks = [];
  (state.cartes||[]).forEach(it=>{
    if(it.img && !it.imgId){
      const id = uid();
      imageCache[id] = it.img;
      tasks.push(idbPut(id, it.img).catch(()=>{}));
      it.imgId = id; delete it.img;
      if(!it.id) it.id = uid();
      changed = true;
    }
  });
  Object.values(state.classes||{}).forEach(c=>{
    Object.values(c.seances||{}).forEach(se=>{
      if(se.bareme && Array.isArray(se.bareme.images)){
        se.bareme.images = se.bareme.images.map(img=>{
          if(typeof img === "string" && img.indexOf("data:")===0){
            const id = uid();
            imageCache[id] = img;
            tasks.push(idbPut(id, img).catch(()=>{}));
            changed = true;
            return id;
          }
          return img;
        });
      }
    });
  });
  return Promise.all(tasks).then(()=>{ if(changed) saveState(); });
}

function uid(){ return "id"+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function normalize(s){ return (s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim(); }
function escAttr(s){ return (s||"").toString().replace(/"/g,"&quot;"); }
function escHtml(s){ return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function getPath(obj, path){ return path.split(".").reduce((o,k)=> (o==null?undefined:o[k]), obj); }
function setPath(obj, path, value){
  const keys = path.split("."); let o = obj;
  for(let i=0;i<keys.length-1;i++){
    const k = keys[i];
    if(o[k]==null) o[k] = /^\d+$/.test(keys[i+1]) ? [] : {};
    o = o[k];
  }
  o[keys[keys.length-1]] = value;
}

/* ===================== HELPERS DOMAINE ===================== */
const CLASSES_COLLEGE = ["4e1","4e2","4e3","4e4"];

function ensureClass(name){
  if(!state.classes[name]) state.classes[name] = { students: [] };
  return state.classes[name];
}
function ensureSeance(cls, num){
  const c = ensureClass(cls);
  if(!c.seances) c.seances = {};
  const key = "s"+num;
  if(!c.seances[key]) c.seances[key] = {
    date:"", groupes:[], presence:{},
    suivi:{rows:{}}, etoile:{rows:{}}, papillon:{rows:{}}, scores:{rows:{}},
    bareme:{images:[]}
  };
  if(!c.seances[key].presence) c.seances[key].presence = {};
  return c.seances[key];
}
function isPresent(se, studentId){
  const p = se.presence && se.presence[studentId];
  return !(p && (p.absent || p.dispense));
}
function studentById(cls, id){
  const c = state.classes[cls]; if(!c) return null;
  return (c.students||[]).find(s=>s.id===id) || null;
}
function groupLabel(cls, groupe){
  return groupe.memberIds.map(id=>{
    const s = studentById(cls,id);
    return s ? (s.prenom? s.prenom : s.nom) : "?";
  }).join(" & ");
}
function fmtClock(ts){
  if(!ts) return "";
  const d = new Date(ts);
  return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
function fmtElapsed(ms){
  if(ms==null || ms<0) return "";
  const totalSec = Math.round(ms/1000);
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return m+":" + String(s).padStart(2,"0");
}
function delayClass(ms){
  const min = ms/60000;
  if(min<=5) return "green";
  if(min<=10) return "orange";
  return "red";
}
function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
const PALETTE_COUNT = 10;

/* ===================== IMPORT ELEVES ===================== */
function parseDelimited(text){
  const lines = text.split(/\r\n|\n|\r/).filter(l=>l.trim().length>0);
  if(!lines.length) return {headerCells:[], rows:[]};
  const first = lines[0];
  const delim = first.includes("\t") ? "\t" : (first.includes(";") ? ";" : ",");
  const headerCells = lines[0].split(delim).map(h=>normalize(h));
  const rows = lines.slice(1).map(l=>l.split(delim));
  return {headerCells, rows};
}
const GSHEET_ID = "1hefgIAhOne-eK2JM9VKidrqkjroWVpSq89bUXBDWYqs";
const GSHEET_GID = "0";
function gsheetSetBtn(disabled, label){
  const btn = document.getElementById("gsheetBtn");
  if(btn){ btn.disabled = disabled; btn.textContent = label; }
}
function importFromGoogleSheet(){
  gsheetSetBtn(true, "⏳ Chargement…");
  const cbName = "coGvizCallback_" + Date.now();
  let done = false;
  let script = null;
  const timeoutId = setTimeout(function(){ finish(new Error("délai dépassé (vérifiez la connexion internet)")); }, 15000);

  function cleanup(){
    clearTimeout(timeoutId);
    try{ delete window[cbName]; }catch(e){ window[cbName] = undefined; }
    if(script && script.parentNode) script.parentNode.removeChild(script);
  }
  function finish(err, counts){
    if(done) return;
    done = true;
    cleanup();
    gsheetSetBtn(false, "🌐 Charger automatiquement depuis le Google Sheet");
    if(err){
      alert("Chargement automatique impossible : "+err.message+"\n\nSi vous testez le fichier en local (file://), ce n'est pas forcément un problème de partage : Google bloque parfois ces requêtes venant d'un fichier local. Réessayez une fois la page déposée sur GitHub Pages (https).\nVous pouvez sinon importer un fichier .csv exporté du collège ci-dessous en attendant.");
      return;
    }
    finishImport(counts);
  }

  window[cbName] = function(resp){
    if(!resp || resp.status==="error"){
      let detail = "raison inconnue";
      if(resp && resp.errors && resp.errors.length){
        const e0 = resp.errors[0];
        detail = (e0.reason||"")+(e0.detailed_message?" — "+e0.detailed_message:(e0.message?" — "+e0.message:""));
      }
      finish(new Error("accès refusé par Google (détail : "+detail+")."));
      return;
    }
    try{
      const table = resp.table;
      const headerCells = table.cols.map(function(c){ return normalize(c.label||c.id||""); });
      const rows = table.rows.map(function(r){
        return r.c.map(function(cell){ return cell ? (cell.v!=null ? cell.v : (cell.f!=null?cell.f:"")) : ""; });
      });
      const counts = applyAutoImportRows(headerCells, rows);
      finish(null, counts);
    }catch(err){
      finish(new Error(err.message||"réponse inattendue de Google"));
    }
  };

  const url = "https://docs.google.com/spreadsheets/d/"+GSHEET_ID+"/gviz/tq?gid="+GSHEET_GID+"&headers=1&tqx=responseHandler:"+cbName;
  script = document.createElement("script");
  script.src = url;
  script.onerror = function(){ finish(new Error("impossible de contacter Google (réseau indisponible, ou feuille inaccessible)")); };
  document.body.appendChild(script);
}
function classeKey(raw){
  let n = normalize(raw).replace(/[^a-z0-9]/g,"");
  const m = n.match(/^4(?:eme|e)?(\d)$/);
  return m ? ("4e"+m[1]) : n;
}
function applyAutoImportRows(headerCells, rows){
  const idxNom = headerCells.findIndex(h=>h.includes("nom") && !h.includes("prenom"));
  const idxPrenom = headerCells.findIndex(h=>h.includes("prenom"));
  const idxClasse = headerCells.findIndex(h=>h.includes("classe"));
  const idxNiveau = headerCells.findIndex(h=>h.includes("niveau"));
  if(idxNom<0) throw new Error("colonne 'Nom' introuvable dans l'en-tête");
  if(idxClasse<0 && idxNiveau<0) throw new Error("aucune colonne Classe ou Niveau détectée");
  const counts = {};
  rows.forEach(cells=>{
    const nom = (cells[idxNom]||"").toString().trim();
    if(!nom) return;
    const prenom = idxPrenom>=0 ? (cells[idxPrenom]||"").toString().trim() : "";
    const classeRaw = idxClasse>=0 ? cells[idxClasse] : cells[idxNiveau];
    const key = classeKey(classeRaw);
    if(!CLASSES_COLLEGE.includes(key)) return;
    const c = ensureClass(key);
    const dup = c.students.find(s=>normalize(s.nom)===normalize(nom) && normalize(s.prenom)===normalize(prenom));
    if(!dup){ c.students.push({id:uid(), nom, prenom}); counts[key]=(counts[key]||0)+1; }
  });
  return counts;
}
function finishImport(counts){
  saveState();
  const classesTouchees = Object.keys(counts).sort();
  if(classesTouchees.length){ uiState.top = classesTouchees[0]; saveUI(); }
  renderApp();
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  if(total===0){ alert("Aucun élève de 4e1 à 4e4 reconnu.\nVérifiez la colonne Classe/Niveau (valeurs attendues : 4e1, 4e2, 4e3 ou 4e4)."); }
  else{ alert(total+" élève(s) importé(s) automatiquement et répartis par classe :\n"+classesTouchees.map(k=>"• "+k+" : "+counts[k]+" élève(s)").join("\n")); }
}

function tabBar(tabs, activeId, actionName, extraAttrs, lvl){
  return `<div class="tabbar lvl${lvl}">${tabs.map(t=>`
    <button class="tabbtn ${t.extraClass||""} ${t.id===activeId?"active":""}" data-action="${actionName}" data-id="${escAttr(t.id)}" ${extraAttrs||""}>${t.label}${t.badge!=null?`<span class="tabbadge">${t.badge}</span>`:""}</button>
  `).join("")}</div>`;
}

function renderApp(){
  const scrollY = window.scrollY;
  const extraClasses = Object.keys(state.classes).filter(c=>!CLASSES_COLLEGE.includes(c)).sort((a,b)=>a.localeCompare(b,"fr"));
  const classNames = CLASSES_COLLEGE.concat(extraClasses);
  const topTabs = [{id:"general", label:"📋 Général"}]
    .concat(classNames.map((c,i)=>({id:c, label:"🏷️ "+c, badge:(state.classes[c]?state.classes[c].students.length:0), extraClass:"class-tab col-c"+(i%PALETTE_COUNT)})))
    .concat([{id:"cartes", label:"🗺️ Cartes du parc"}]);
  if(!topTabs.some(t=>t.id===uiState.top)) uiState.top = "general";

  let panel = "";
  if(uiState.top==="general") panel = renderGeneralPanel();
  else if(uiState.top==="cartes") panel = renderCartesPanel();
  else panel = renderClassPanel(uiState.top);

  const html = tabBar(topTabs, uiState.top, "set-top-tab", "", 1) + `<div class="tabpanel">${panel}</div>`;

}

function twoColTable(headHtml, items, rowFn, colspan, emptyMsg){
  if(!items.length){
    return `<div class="table-wrap"><table class="co"><thead><tr>${headHtml}</tr></thead>
      <tbody><tr><td colspan="${colspan}" class="empty">${emptyMsg}</td></tr></tbody></table></div>`;
  }
  const mid = Math.ceil(items.length/2);
  const cols = [items.slice(0,mid), items.slice(mid)].filter(c=>c.length);
  const build = (list)=>`<div class="table-wrap" style="flex:1 1 280px;"><table class="co">
    <thead><tr>${headHtml}</tr></thead>
    <tbody>${list.map(rowFn).join("")}</tbody>
  </table></div>`;
  return `<div class="row" style="align-items:flex-start;flex-wrap:wrap;">${cols.map(build).join("")}</div>`;
}

  const se = ensureSeance(cls,num);

      ${g.memberIds.map(sid=>{

        return `<span class="chip">${escHtml(s?( (s.prenom||s.nom) ):"?")}
          <button data-action="remove-from-groupe" data-class="${escAttr(cls)}" data-seance="${num}" data-groupe="${g.id}" data-student="${sid}">✕</button>

      <button class="btn-xs btn-danger" data-action="delete-groupe" data-class="${escAttr(cls)}" data-seance="${num}" data-groupe="${g.id}">supprimer groupe</button>
    </div>
  `).join("");
  return `

/* ---- Parcours Étoile (séance 1 : 5 balises / séance 2 : 10 balises) ---- */
function renderEtoile(cls, num){
  const se = ensureSeance(cls,num);
  const nb = ETOILE_BALISES[num] || 5;
  if(!se.groupes.length) return "<div class=\"empty\">Constituez d'abord les binômes.</div>";
  const maxTotalMs = num===2 ? 90*60*1000 : null;
  const headerBalises = Array.from({length:nb},(_,i)=>`<th class="col-c${(i+2)%PALETTE_COUNT}">B${i+1}</th>`).join("");
  const rows = se.groupes.map(g=>{
    const r = se.etoile.rows[g.id] || {depart:null, balises:Array.from({length:nb},()=>({status:"none",time:null})), prevu:"", note:""};
    if(!r.balises || r.balises.length!==nb){ r.balises = Array.from({length:nb},(_,i)=> r.balises&&r.balises[i] ? r.balises[i] : ({status:"none",time:null})); }
    se.etoile.rows[g.id]=r;
    const nbTrouvees = r.balises.filter(b=>b.status==="ok").length;
    const okTimes = r.balises.filter(b=>b.status==="ok" && b.time).map(b=>b.time);
    const lastOk = okTimes.length? Math.max(...okTimes) : null;
    const totalMs = (r.depart && lastOk) ? (lastOk-r.depart) : null;
    const totalColor = (totalMs!=null && maxTotalMs && totalMs>maxTotalMs) ? "red" : (totalMs!=null?"green":"");
    const suggestedNote = Math.round((nbTrouvees/nb)*20*10)/10;
    const balisesHtml = r.balises.map((b,bi)=>{
      let cls2 = b.status==="ok"?"ok":(b.status==="ko"?"ko":"");
      let inner = b.status==="ok" ? "✔" : (b.status==="ko" ? "✘" : "—");
      let timeTag = "";
      if(b.status==="ok" && b.time && r.depart){
        const dms = b.time-r.depart; timeTag = `<span class="time-tag ${delayClass(dms)}">${fmtElapsed(dms)}</span>`;
      }
      return `<td><span class="cell-btn ${cls2}" data-action="toggle-balise" data-class="${escAttr(cls)}" data-seance="${num}" data-groupe="${g.id}" data-index="${bi}">${inner}${timeTag}</span></td>`;
    }).join("");
    return `<tr>
      <td class="left col-c0" style="color:#fff;">${escHtml(groupLabel(cls,g))}</td>
      <td class="left"><input class="inline-text" type="text" placeholder="codes prévus (ex: B2,B5,B9)" value="${escAttr(r.prevu||"")}" data-path="classes.${escAttr(cls)}.seances.s${num}.etoile.rows.${g.id}.prevu"></td>
      <td>${r.depart? fmtClock(r.depart) : `<button class="btn-small btn-teal" data-action="etoile-depart" data-class="${escAttr(cls)}" data-seance="${num}" data-groupe="${g.id}">Départ</button>`}</td>
      ${balisesHtml}
      <td><b>${nbTrouvees}/${nb}</b></td>
      <td><b class="time-tag ${totalColor}">${totalMs!=null?fmtElapsed(totalMs):""}</b></td>
      <td><input class="note-input" type="number" min="0" max="20" step="0.5" value="${escAttr(r.note!==""&&r.note!=null?r.note:suggestedNote)}" data-path="classes.${escAttr(cls)}.seances.s${num}.etoile.rows.${g.id}.note"></td>
    </tr>`;
  }).join("");
  return `<p class="hint">Cliquez sur une balise pour la faire passer : — → ✔ (validée, temps affiché) → ✘ (non validée) → —.
  ${num===2? " Durée totale max : 1h30. Temps max conseillé par balise : 25 min." : ""} La « note suggérée » est pré-remplie, modifiez-la selon le barème (photo).</p>
  <div class="table-wrap"><table class="co">
    <thead><tr>
      <th class="col-c0">Groupe</th><th class="col-c8 left">Parcours prévu</th><th class="col-c4">Départ</th>
      ${headerBalises}
      <th class="col-c5">Trouvées</th><th class="col-c6">Temps total</th><th class="col-c7">Note</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---- Parcours Papillon (séance 2 et 3) ---- */
function renderPapillon(cls, num){
  const se = ensureSeance(cls,num);
  if(!se.groupes.length) return "<div class=\"empty\">Constituez d'abord les binômes.</div>";
  const emptyBalises = ()=>Array.from({length:3},()=>({state:"vide"}));
  const rows = se.groupes.map(g=>{
    const r = se.papillon.rows[g.id] || {depart:null, p1:{balises:emptyBalises(), status:"none", time:null}, p2:{balises:emptyBalises(), status:"none", time:null}, note:""};
    se.papillon.rows[g.id]=r;
    const points = p=>p.balises.reduce((s,b)=> s + (b.state==="rouge"?10:(b.state==="verte"?5:0)),0);
    const totalPoints = points(r.p1)+points(r.p2);
    function parcoursCell(p, pnum){
      const chips = p.balises.map((b,bi)=>{
        const label = b.state==="vide"?"—":(b.state==="rouge"?"Rge 10":(b.state==="verte"?"Vte 5":"Raté"));
        const cls2 = b.state==="vide"?"":b.state;
        return `<span class="cell-btn ${cls2}" style="min-width:52px;margin:1px;" data-action="toggle-papillon-balise" data-class="${escAttr(cls)}" data-seance="${num}" data-groupe="${g.id}" data-parcours="${pnum}" data-index="${bi}">${label}</span>`;
      }).join("");
      let statusLabel = p.status==="ok"?"✔ validé":(p.status==="ko"?"✘ invalide":"en cours");
      let statusCls = p.status==="ok"?"ok":(p.status==="ko"?"ko":"");
      let timeHtml = (p.status==="ok" && p.time && r.depart)? `<span class="time-tag green">${fmtElapsed(p.time-r.depart)}</span>` : "";
      return `<div>${chips}</div><div style="margin-top:4px;"><span class="cell-btn ${statusCls}" data-action="toggle-parcours-status" data-class="${escAttr(cls)}" data-seance="${num}" data-groupe="${g.id}" data-parcours="${pnum}">${statusLabel}${timeHtml}</span></div>`;
    }
    return `<tr>
      <td class="left col-c0" style="color:#fff;">${escHtml(groupLabel(cls,g))}</td>
      <td>${r.depart? fmtClock(r.depart) : `<button class="btn-small btn-teal" data-action="papillon-depart" data-class="${escAttr(cls)}" data-seance="${num}" data-groupe="${g.id}">Départ</button>`}</td>
      <td class="left">${parcoursCell(r.p1,1)}</td>
      <td class="left">${parcoursCell(r.p2,2)}</td>
      <td><b>${totalPoints} pts</b></td>
      <td><input class="note-input" type="number" min="0" max="20" step="0.5" value="${escAttr(r.note!==""&&r.note!=null?r.note:totalPoints)}" data-path="classes.${escAttr(cls)}.seances.s${num}.papillon.rows.${g.id}.note"></td>
    </tr>`;
  }).join("");
  return `<p class="hint">30 min maximum. Cliquez sur chaque balise du parcours pour choisir son résultat (—, balise Rouge = 10 pts, balise Verte = 5 pts, Ratée). Cliquez ensuite sur « en cours » pour valider/invalider le parcours entier (le temps s'affiche à la validation).</p>
  <div class="table-wrap"><table class="co">
    <thead><tr><th class="col-c0">Groupe</th><th class="col-c4">Départ</th><th class="col-c1 left">Parcours 1 (3 balises)</th><th class="col-c2 left">Parcours 2 (3 balises)</th><th class="col-c5">Points</th><th class="col-c7">Note</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ---- Course aux scores (séance 3) ---- */
function renderScores(cls, num){
  const se = ensureSeance(cls,num);
  if(!se.groupes.length) return "<div class=\"empty\">Constituez d'abord les binômes.</div>";
  const rows = se.groupes.map(g=>{
    const r = se.scores.rows[g.id] || {depart:null, fin:null, found:[], note:""};
    se.scores.rows[g.id]=r;
    const total = r.found.reduce((s,f)=>s+(Number(f.points)||0),0);
    const tempsTotal = (r.depart && r.fin) ? fmtElapsed(r.fin-r.depart) : "";
    return `<tr>
      <td class="left col-c0" style="color:#fff;">${escHtml(groupLabel(cls,g))}</td>
      <td>${r.depart? fmtClock(r.depart) : `<button class="btn-small btn-teal" data-action="scores-depart" data-class="${escAttr(cls)}" data-seance="${num}" data-groupe="${g.id}">Départ</button>`}</td>
      <td class="left" style="max-width:260px;white-space:normal;">
        ${r.found.map((f,fi)=>`<span class="chip">${escHtml(f.code)} (${f.points}pt)
          <button data-action="scores-remove" data-class="${escAttr(cls)}" data-seance="${num}" data-groupe="${g.id}" data-index="${fi}">✕</button></span>`).join("")}
        <button class="btn-xs" data-action="scores-add" data-class="${escAttr(cls)}" data-seance="${num}" data-groupe="${g.id}" ${!r.depart?"disabled":""}>+ balise trouvée</button>
      </td>
      <td>${r.fin? fmtClock(r.fin) : `<button class="btn-small btn-navy" data-action="scores-fin" data-class="${escAttr(cls)}" data-seance="${num}" data-groupe="${g.id}" ${!r.depart?"disabled":""}>Fin</button>`}</td>
      <td><b>${total} pts</b></td>
      <td><b>${tempsTotal}</b></td>
      <td><input class="note-input" type="number" min="0" max="20" step="0.5" value="${escAttr(r.note!=null?r.note:"")}" data-path="classes.${escAttr(cls)}.seances.s${num}.scores.rows.${g.id}.note"></td>
    </tr>`;
  }).join("");
  return `<p class="hint">Chaque équipe cherche librement un maximum de balises dans le temps imparti. Ajoutez chaque balise trouvée avec son code et le nombre de points qu'elle rapporte.</p>
  <div class="table-wrap"><table class="co">
    <thead><tr><th class="col-c0">Groupe</th><th class="col-c4">Départ</th><th class="col-c1 left">Balises trouvées</th><th class="col-c7">Fin</th><th class="col-c5">Score</th><th class="col-c6">Temps total</th><th class="col-c8">Note</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ---------- Cartes du parc ---------- */
function renderCartesPanel(){
  const imgs = state.cartes||[];
  return `
    <h2 class="ptitle">🗺️ Cartes du parc</h2>
    <label class="btn" style="display:inline-block;">📷 Ajouter une carte
      <input type="file" accept="image/*" data-action="upload-image" data-target="cartes" style="display:none;">
    </label>
    <div class="img-grid" style="margin-top:10px;">
      ${imgs.map((it,i)=>`
        <div class="img-card">${imageCache[it.imgId] ? `<img src="${imageCache[it.imgId]}" data-action="open-lightbox" title="Cliquer pour agrandir">` : `<div class="empty">Chargement de l'image…</div>`}
          <div class="cap"><input class="inline-text" style="width:70%;" type="text" value="${escAttr(it.label)}" data-path="cartes.${i}.label">
          <button class="btn-xs btn-danger" data-action="delete-image" data-target="cartes" data-index="${i}">✕</button></div>
        </div>`).join("") || "<div class=\"empty\">Aucune carte ajoutée.</div>"}
    </div>
  `;
}

/* ===================== ACTIONS ===================== */
const app = document.getElementById("app");

app.addEventListener("click", function(e){
  const t = e.target.closest("[data-action]");
  if(!t) return;
  const action = t.dataset.action;
  const cls = t.dataset.class, num = t.dataset.seance, gid = t.dataset.groupe, sid = t.dataset.student;

  if(action==="open-lightbox"){ openLightbox(t.getAttribute("src")); return; }
  if(action==="close-lightbox"){ closeLightbox(); return; }

  if(action==="set-top-tab"){ uiState.top = t.dataset.id; saveUI(); renderApp(); return; }
  if(action==="set-class-tab"){ uiState.classTab[cls] = t.dataset.id; saveUI(); renderApp(); return; }
  if(action==="set-seance-tab"){ uiState.seanceTab[cls+"_s"+num] = t.dataset.id; saveUI(); renderApp(); return; }

  if(action==="import-gsheet"){ importFromGoogleSheet(); return; }

  if(action==="build-groupes"){
    const se = ensureSeance(cls,num);
    const hasData = Object.keys(se.suivi.rows).length || Object.keys(se.etoile.rows).length || Object.keys(se.papillon.rows).length || Object.keys(se.scores.rows).length;
    if(hasData && !confirm("Regénérer les binômes va réinitialiser le suivi déjà saisi pour cette séance. Continuer ?")) return;
    const roster = state.classes[cls].students.filter(s=>isPresent(se,s.id));
    const arr = shuffleArray([...roster]);
    const n = arr.length, groupsCount = Math.floor(n/2);
    const groupes = [];
    let idx=0;
    for(let g=0;g<groupsCount;g++){
      const isLast = g===groupsCount-1;
      const size = (isLast && n%2===1) ? 3 : 2;
      groupes.push({id:uid(), memberIds: arr.slice(idx, idx+size).map(s=>s.id)});
      idx+=size;
    }
    if(n===1) groupes.push({id:uid(), memberIds:[arr[0].id]});
    se.groupes = groupes;
    se.suivi.rows={}; se.etoile.rows={}; se.papillon.rows={}; se.scores.rows={};
    saveState(); renderApp(); return;
  }
  if(action==="toggle-presence"){
    const se = ensureSeance(cls,num);
    if(!se.presence[sid]) se.presence[sid] = {absent:false, dispense:false};
    const p = se.presence[sid];
    if(!p.absent && !p.dispense){ p.absent=true; }
    else if(p.absent){ p.absent=false; p.dispense=true; }
    else { p.dispense=false; }
    saveState(); renderApp();
    return;
  }
  if(action==="delete-groupe"){ const se=ensureSeance(cls,num); se.groupes = se.groupes.filter(g=>g.id!==gid); saveState(); renderApp(); return; }
  if(action==="remove-from-groupe"){ const se=ensureSeance(cls,num); const g=se.groupes.find(g=>g.id===gid); if(g) g.memberIds=g.memberIds.filter(id=>id!==sid); saveState(); renderApp(); return; }
  if(action==="pick-student"){
    const key = cls+"_s"+num;
    const prev = pendingSelection[key];
    if(!prev){ pendingSelection[key] = sid; }
    else if(prev===sid){ pendingSelection[key] = null; }
    else{
      const se = ensureSeance(cls,num);
      se.groupes.push({id:uid(), memberIds:[prev, sid]});
      pendingSelection[key] = null;
      saveState();
    }
    renderApp();
    return;
  }
  if(action==="add-pending-to-groupe"){
    const key = cls+"_s"+num;
    const pending = pendingSelection[key];
    if(!pending) return;
    const se = ensureSeance(cls,num);
    const g = se.groupes.find(g=>g.id===gid);
    if(g && !g.memberIds.includes(pending)) g.memberIds.push(pending);
    pendingSelection[key] = null;
    saveState(); renderApp();
    return;
  }

  if(action==="etoile-depart"){ setRow("etoile",cls,num,gid,r=>{r.depart=Date.now();}); return; }
  if(action==="toggle-balise"){
    const bi = Number(t.dataset.index);
    setRow("etoile",cls,num,gid,r=>{
      if(!r.depart){ alert("Cliquez d'abord sur Départ."); return; }
      const b = r.balises[bi];
      if(b.status==="none"){ b.status="ok"; b.time=Date.now(); }
      else if(b.status==="ok"){ b.status="ko"; }
      else { b.status="none"; b.time=null; }
    });
    return;
  }

  if(action==="papillon-depart"){ setRow("papillon",cls,num,gid,r=>{r.depart=Date.now();}); return; }
  if(action==="toggle-papillon-balise"){
    const pnum = t.dataset.parcours, bi = Number(t.dataset.index);
    setRow("papillon",cls,num,gid,r=>{
      const p = r["p"+pnum]; const b = p.balises[bi];
      const order = ["vide","rouge","verte","rate"];
      b.state = order[(order.indexOf(b.state)+1)%order.length];
    });
    return;
  }
  if(action==="toggle-parcours-status"){
    const pnum = t.dataset.parcours;
    setRow("papillon",cls,num,gid,r=>{
      if(!r.depart){ alert("Cliquez d'abord sur Départ."); return; }
      const p = r["p"+pnum];
      if(p.status==="none"){ p.status="ok"; p.time=Date.now(); }
      else if(p.status==="ok"){ p.status="ko"; }
      else { p.status="none"; p.time=null; }
    });
    return;
  }

  if(action==="suivi-depart"){ setRow("suivi",cls,num,gid,r=>{r.depart=Date.now();}); return; }
  if(action==="suivi-retour"){ setRow("suivi",cls,num,gid,r=>{r.retour=Date.now();}); return; }
  if(action==="suivi-add-log"){
    const code = prompt("Code de la balise trouvée ?"); if(!code) return;
    setRow("suivi",cls,num,gid,r=>{ r.log.push({code, ts:Date.now()}); });
    return;
  }
  if(action==="suivi-remove-log"){ const li=Number(t.dataset.index); setRow("suivi",cls,num,gid,r=>{ r.log.splice(li,1); }); return; }

  if(action==="scores-depart"){ setRow("scores",cls,num,gid,r=>{r.depart=Date.now();}); return; }
  if(action==="scores-fin"){ setRow("scores",cls,num,gid,r=>{r.fin=Date.now();}); return; }
  if(action==="scores-add"){
    const code = prompt("Code de la balise trouvée ?"); if(!code) return;
    const pts = Number(prompt("Points pour cette balise ?","5")) || 0;
    setRow("scores",cls,num,gid,r=>{ r.found.push({code, points:pts}); });
    return;
  }
  if(action==="scores-remove"){ const fi=Number(t.dataset.index); setRow("scores",cls,num,gid,r=>{ r.found.splice(fi,1); }); return; }

  if(action==="upload-image"){ return; } /* handled by change */
  if(action==="delete-image"){
    const target = t.dataset.target, i = Number(t.dataset.index);
    let imgId;
    if(target==="cartes"){ imgId = state.cartes[i].imgId; state.cartes.splice(i,1); }
    else { const se = ensureSeance(cls,num); imgId = se.bareme.images[i]; se.bareme.images.splice(i,1); }
    delete imageCache[imgId];
    idbDelete(imgId).catch(()=>{});
    saveState(); renderApp(); return;
  }

  if(action==="export-backup"){
    const exportObj = { state: state, images: imageCache };
    const blob = new Blob([JSON.stringify(exportObj)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "CO_sauvegarde_"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  if(action==="reset-all"){
    if(confirm("Supprimer définitivement toutes les données (classes, séances, cartes) ? Cette action est irréversible — exportez une sauvegarde avant si besoin.")){
      Object.keys(imageCache).forEach(id=>{ idbDelete(id).catch(()=>{}); });
      imageCache = {};
      state = defaultState(); saveState();
      uiState = defaultUI(); saveUI();
      renderApp();
    }
    return;
  }
});

function openLightbox(src){
  if(!src) return;
  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightbox").style.display = "flex";
}
function closeLightbox(){
  document.getElementById("lightbox").style.display = "none";
  document.getElementById("lightboxImg").src = "";
}
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeLightbox(); });

function setRow(situ, cls, num, gid, mutate){
  const se = ensureSeance(cls,num);
  const defaults = {
    suivi: ()=>({depart:null, log:[], retour:null, obs:""}),
    etoile: ()=>({depart:null, balises:Array.from({length:ETOILE_BALISES[num]||5},()=>({status:"none",time:null})), prevu:"", note:""}),
    papillon: ()=>({depart:null, p1:{balises:Array.from({length:3},()=>({state:"vide"})), status:"none", time:null}, p2:{balises:Array.from({length:3},()=>({state:"vide"})), status:"none", time:null}, note:""}),
    scores: ()=>({depart:null, fin:null, found:[], note:""})
  };
  if(!se[situ].rows[gid]) se[situ].rows[gid] = defaults[situ]();
  mutate(se[situ].rows[gid]);
  saveState(); renderApp();
}

app.addEventListener("change", function(e){
  const el = e.target;

  if(el.dataset.path){
    const val = el.dataset.bool ? el.checked : el.value;
    setPath(state, el.dataset.path, val);
    saveState(); renderApp();
    return;
  }
  if(el.dataset.action==="upload-image"){
    const file = el.files[0]; if(!file) return;
    const target = el.dataset.target, cls = el.dataset.class, num = el.dataset.seance;
    resizeImageFile(file, 1600, 0.82).then(function(dataURL){
      const imgId = uid();
      imageCache[imgId] = dataURL;
      idbPut(imgId, dataURL).catch(()=>{ alert("Le stockage des images semble indisponible sur cet appareil/navigateur."); });
      if(target==="cartes"){
        state.cartes = state.cartes||[];
        state.cartes.push({id:uid(), label:file.name, imgId:imgId});
      } else {
        const se = ensureSeance(cls,num);
        se.bareme.images.push(imgId);
      }
      saveState(); renderApp();
    }).catch(function(){ alert("Impossible de traiter cette image."); });
    return;
  }
  if(el.id==="importCsvFile"){
    const file = el.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const {headerCells, rows} = parseDelimited(reader.result);
      if(!headerCells.length){ alert("Aucune donnée détectée dans le fichier."); return; }
      let counts;
      try{ counts = applyAutoImportRows(headerCells, rows); }
      catch(err){
        if(err.message.indexOf("Nom")>=0) alert("Colonne 'Nom' introuvable dans la première ligne du fichier (en-têtes).");
        else alert("Aucune colonne Classe ou Niveau détectée dans le fichier.");
        return;
      }
      finishImport(counts);
      el.value = "";
    };
    reader.readAsText(file, "UTF-8");
    return;
  }
  if(el.id==="importBackupFile"){
    const file = el.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      let data;
      try{ data = JSON.parse(reader.result); }
      catch(err){ alert("Fichier de sauvegarde invalide."); return; }
      if(!confirm("Remplacer toutes les données actuelles par cette sauvegarde ?")) return;
      const newState = data && data.state ? data.state : data;
      const newImages = data && data.images ? data.images : {};
      state = newState;
      const putTasks = Object.keys(newImages).map(id=>{
        imageCache[id] = newImages[id];
        return idbPut(id, newImages[id]).catch(()=>{});
      });
      Promise.all(putTasks).then(()=>migrateLegacyImages()).then(()=>{
        saveState(); renderApp();
      });
    };
    reader.readAsText(file,"UTF-8");
    return;
  }
});

/* ===================== HORLOGE ===================== */
setInterval(()=>{
  const el = document.getElementById("liveClock");
  if(el) el.textContent = new Date().toLocaleTimeString("fr-FR");
}, 1000);

/* ===================== INIT ===================== */
renderApp();
idbGetAll().then(function(map){ imageCache = map; return migrateLegacyImages(); }).then(renderApp).catch(function(){ renderApp(); });

/* Hors ligne (une fois ouverte au moins une fois) : nécessite une page servie en https (GitHub Pages).
   Ne fonctionne pas en ouvrant le fichier directement (file://), ce qui est normal. */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
